# configs/alpaca.yaml

model:
  path: /userspace/pes/diploma_materials/models/Llama-3.2-1B
  dtype: bfloat16

dataset:
  path: /userspace/pes/diploma_materials/datasets/alpaca_data
  type: alpaca

task_type: reconstruction

training:
  batch_size: 1
  maxiter: 2000
  max_tokens: 256
  threshold: 0.95
  seed: 42

logging:
  save_every: 10
  save_log_path: /userspace/pes/diploma/logs/reconstruction_alpaca_exp.json
  save_path: /userspace/pes/diploma/results/reconstruction_alpaca_exp.json