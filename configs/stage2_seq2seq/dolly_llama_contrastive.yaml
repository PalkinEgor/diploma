experiment:
  type: contrastive

model:
  path: /userspace/pes/diploma_materials/models/Llama-3.2-1B-Instruct
  dtype: bfloat16
  encoder:
    type: contrastive
    path: /userspace/pes/diploma_materials/models/Llama-3.2-1B-Instruct
    pooling: last

dataset:
  path: /userspace/pes/diploma/results/dolly_llama_protofit.json
  type: dolly

training:
  batch_size: 16
  max_tokens: 256
  n_epochs: 30
  seed: 42
  shuffle: true

  loss_weights:
    reconstruction: 1.0
    infonce: 1.0
    dbll: 1.0
    length: 1.0

logging:
  save_log_path: /userspace/pes/diploma/logs/dolly_llama_contrastive.log
  save_model_path: /userspace/pes/diploma/results/dolly_llama_contrastive_encoder.pt
