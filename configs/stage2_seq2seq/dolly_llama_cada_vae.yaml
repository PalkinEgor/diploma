experiment:
  type: cada_vae

model:
  path: /userspace/pes/diploma_materials/models/Llama-3.2-1B-Instruct
  dtype: bfloat16
  encoder:
    type: cada_vae
    latent_dim: 256
    hidden_dim: 512

dataset:
  path: /userspace/pes/diploma/results/dolly_llama_protofit.json
  type: dolly

teacher:
  path: /userspace/pes/diploma_materials/models/qwen3_embedder_4b
  dtype: bfloat16
  normalize: true

training:
  batch_size: 32
  max_tokens: 256
  n_epochs: 50
  seed: 42
  shuffle: true
  loss_weights:
    ce: 1.0              # CE-реконструкция текста
    recon: 1.0           # реконструкция внутри доменов
    kl: 1.0              # KL к априору N(0, I)
    cross_align: 1.0     # Cross-Alignment
    dist_align: 1.0      # Distribution-Alignment (2-Вассерштейн)

logging:
  save_log_path: /userspace/pes/diploma/logs/dolly_llama_cada_vae.log
  save_model_path: /userspace/pes/diploma/results/dolly_llama_cada_vae_encoder.pt
