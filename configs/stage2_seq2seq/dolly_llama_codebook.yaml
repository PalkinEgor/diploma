experiment:
  type: codebook

model:
  path: /userspace/pes/diploma_materials/models/Llama-3.2-1B-Instruct
  dtype: bfloat16
  encoder:
    type: codebook
    path: /userspace/pes/diploma_materials/models/Llama-3.2-1B-Instruct
    mean_pooling: false
    code_books:
      G: 2
      V: 32
      tau: 1.0
      m_vector: false

dataset:
  path: /userspace/pes/diploma/results/dolly_llama_protofit.json
  type: dolly

training:
  batch_size: 6
  max_tokens: 256
  n_epochs: 20
  seed: 42
  shuffle: true
  diversity_loss_weight: 0.1

logging:
  save_log_path: /userspace/pes/diploma/logs/dolly_llama_codebook.log
  save_model_path: /userspace/pes/diploma/results/dolly_llama_codebook_encoder.pt
