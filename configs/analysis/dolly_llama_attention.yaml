# Карты внимания декодера к прото-токену e при одношаговой реконструкции.
experiment:
  type: attention

model:
  path: /userspace/pes/diploma_materials/models/Llama-3.2-1B-Instruct
  dtype: bfloat16

dataset:
  path: /userspace/pes/diploma/results/dolly_llama_protofit.json
  type: noise

training:
  batch_size: 1
  max_tokens: 256
  seed: 42
  mean_attention: false

logging:
  save_every: 10
  save_path: /userspace/pes/diploma/results/dolly_llama_attention.json
