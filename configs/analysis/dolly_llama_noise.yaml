# Эксперимент устойчивости прото-токенов к шуму.
experiment:
  type: noise

model:
  path: /userspace/pes/diploma_materials/models/Llama-3.2-1B-Instruct
  dtype: bfloat16

dataset:
  path: /userspace/pes/diploma/results/dolly_llama_protofit.json
  type: noise

training:
  batch_size: 1
  max_tokens: 256
  seed: 42
  alphas: [0.0, 0.1, 0.25, 0.5, 1.0]
  noise_types: [gaussian, uniform, sinusoidal, exponential]

logging:
  save_path: /userspace/pes/diploma/results/dolly_llama_noise_effect.json
